name: Deploy docs site

# Builds the docs site in /site (the shared docs-theme, STANDARDS §7) on every
# version tag, or by hand from the Actions tab. It is served at
# https://docs.stravelakis.com/image-forge/ through the organisation site.
#
# Tags may only deploy once Settings → Environments → github-pages has a
# deployment rule for tag v*. Out of the box only the default branch may.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOCS_DIR: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.DOCS_DIR }}/package-lock.json
      - run: npm ci
        working-directory: ${{ env.DOCS_DIR }}
      - run: npm run build
        working-directory: ${{ env.DOCS_DIR }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.DOCS_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
