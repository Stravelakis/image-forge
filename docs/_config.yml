# GitHub Pages configuration for the Image Forge documentation site.
#
# just-the-docs gives us a sidebar and, crucially, real full-text search —
# which is the thing that makes documentation usable rather than merely
# present. It is a remote theme, so there is nothing to vendor or keep updated.
title: Image Forge
description: Bulk AI image generation from a spreadsheet, using your own API keys.
remote_theme: just-the-docs/just-the-docs

# Pages live in /docs but the site is served from the repo root path.
baseurl: "/image-forge"
# Served under the organisation site Stravelakis.github.io, which owns this
# domain. Every project site without its own domain appears at /<repo>/ here.
url: "https://docs.stravelakis.com"

search_enabled: true
search:
  heading_level: 3
  previews: 3
  tokenizer_separator: /[\s/]+/

color_scheme: dark
heading_anchors: true

aux_links:
  "View on GitHub":
    - "https://github.com/Stravelakis/image-forge"
  "Download for Windows":
    - "https://github.com/Stravelakis/image-forge/releases/latest"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: 'Apache-2.0. Keys stay on your machine.'

plugins:
  - jekyll-remote-theme

exclude:
  - node_modules/
